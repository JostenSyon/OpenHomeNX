[package]
name = "pkm_rs_resources"
version = "1.16.0"
edition = "2024"
description = "Resource data and associated types for the pkm_rs crate"
repository = "https://github.com/andrewbenington/OpenHome"
license = "GPL-3.0+"

[dependencies]
pkm_rs_types = {path = "../pkm_rs_types"}
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
num = { version = "0.4.3", default-features = false }
getrandom = { version = "0.4.3", optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys = { version = "0.3.104", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
static_assertions = "1.1.0"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
strum_macros = "0.28.0"
rand = { version = "0.10.2", optional = true }
arbitrary-int = "2.1.1"
tsify = { version = "0.5.6", optional = true }

[lib]
name = "pkm_rs_resources"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
missing_const_for_fn = "warn"

[features]
default = ["alloc"]
std = ["serde/std", "serde_json/std", "num/std", "strum/std", "getrandom/std", "tsify", "pkm_rs_types/std"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "getrandom/wasm_js", "pkm_rs_types/wasm", "tsify"]
randomize = ["rand", "pkm_rs_types/randomize"]
alloc = ["serde/alloc", "serde_json/alloc", "pkm_rs_types/alloc"]
