[package]
name = "pkm_rs"
version = "1.16.0"
authors = ["Andrew Benington"]
edition = "2024"
description = "Read/write Pokémon save files and .pkm files"
repository = "https://github.com/andrewbenington/OpenHome"
license = "GPL-3.0+"

[dependencies]
pkm_rs_types = {path = "../pkm_rs_types"}
pkm_rs_resources = {path = "../pkm_rs_resources"}
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
num = { version = "0.4.3", default-features = false, features = ["alloc"] }
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys = { version = "0.3.104", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
pkm_rs_derive = { path = "../pkm_rs_derive" }
static_assertions = "1.1.0"
sha2 = { version = "0.11.0", default-features = false }
rand = { version = "0.10.2", optional = true }
getrandom = { version = "0.4.3", optional = true }
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"]  }
strum_macros = "0.28.0"
console_error_panic_hook = { version = "0.1.7", optional = true }
arbitrary-int = "2.1.1"
tsify = { version = "0.5.6", features = [ "js" ], optional = true }
sha1 = { version = "0.11.0", default-features = false }
aes = { version = "0.9.2", default-features = false }
specta = { version = "=2.0.0-rc.22", default-features = false, features = ["derive"], optional = true }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
pretty_assertions = { version = "1.4.1", default-features = false, optional = true }
pretty-hex = { version = "0.4.2", default-features = false, optional = true }
arrayref = "0.3.9"

[lib]
name = "pkm_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
missing_const_for_fn = "warn"

[features]
default = ["alloc"]
std = ["pkm_rs_types/std", "pkm_rs_resources/std", "serde/std", "serde_json/std", "num/std", "serde_bytes/std", "specta", "pretty_assertions/std", "pretty-hex", "strum/std"]
wasm = ["wasm-bindgen", "js-sys", "serde-wasm-bindgen", "getrandom/wasm_js", "getrandom", "pkm_rs_types/wasm", "pkm_rs_resources/wasm", "console_error_panic_hook", "tsify"]
randomize = ["rand", "pkm_rs_types/randomize", "pkm_rs_resources/randomize"]
# WIP: port Gen1/2/4/5/6 dal TS upstream — INCOMPLETO, non nel build di default
newgen = []
alloc = ["pkm_rs_types/alloc", "pkm_rs_resources/alloc", "serde/alloc", "serde_json/alloc", "serde_bytes/alloc"]

[dev-dependencies]
assert-json-diff = "2.0.2"
hex = "0.4.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
